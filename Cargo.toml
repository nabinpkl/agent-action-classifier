# Virtual workspace root. The pure PDP core lives in crates/policy_decision and stays
# free of any FFI types; the PyO3 binding crate (crates/policy_decision_py) lands in the
# next slice and is the only place pyo3 appears. Layout follows the tokenizers/polars
# precedent (pure core crate + thin cdylib binding). See docs/adr/0011.
[workspace]
resolver = "3"
members = ["crates/*"]
