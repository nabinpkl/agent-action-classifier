[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "agent-action-classifier"
version = "0.0.0"
description = "Python host for the agent-action governance classifier: PEP adapter, judge, audit log, and context over the Rust PDP core."
requires-python = ">=3.13"
dependencies = []

# maturin builds the policy_decision_py cdylib into this wheel. It cannot auto-locate a
# crate in a workspace (maturin#1372), so it is pointed at the binding via manifest-path;
# the compiled module is the private `agent_action_classifier._core`.
[tool.maturin]
python-source = "python"
manifest-path = "crates/policy_decision_py/Cargo.toml"
module-name = "agent_action_classifier._core"
features = ["policy_decision_py/extension-module"]

[dependency-groups]
# Dev tooling pinned per the dependency-vetting on 2026-06-06 (maintenance + supply
# chain). ty is pre-1.0 (0.0.x) with breaking changes between releases, so it is
# pinned EXACTLY; ruff is API-stable, so a floor is fine. See the commit body.
dev = [
    "ruff>=0.15.16",
    "ty==0.0.44",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty]
