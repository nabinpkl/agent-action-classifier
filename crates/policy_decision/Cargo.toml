[package]
name = "policy_decision"
version = "0.0.0"
edition = "2024"
description = "Pure agent-action governance PDP: decide a verdict from a canonical action, org policy, and context (OWASP Agentic, ASI05 v0)."
publish = false

# No runtime dependencies: the PDP core is std-only, pure, and deterministic by
# construction (testable with zero infrastructure). thiserror lands later, at the
# real host PAP policy-loading boundary where callers branch on failure modes.
[dependencies]

# Dev-only: the conformance-corpus harness (tests/, later benches/) loads the
# external JSON spec and maps it to the domain types at the edge, so the core stays
# serde-free. anyhow (not thiserror) because the harness only reports errors, never
# branches on them. Vetted 2026-06-06 (maintenance + supply chain).
#
# cedar-policy + criterion are the ADR-0017 speed-spike gate ONLY (dev-dep, not a
# runtime dependency): the bench measures whether embedded Cedar eval meets the
# stage-1 budget before the core is swapped to it. Promoted to a real dependency in
# the swap (TASKS #2) iff the gate passes.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cedar-policy = "4.11"
criterion = "0.5"

[[bench]]
name = "cedar_decide"
harness = false
