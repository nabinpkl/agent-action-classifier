[package]
name = "policy_decision"
version = "0.0.0"
edition = "2024"
description = "Agent-action governance PDP over Cedar: decide a verdict from a canonical action, org policy, and context (OWASP Agentic, ASI05 v0)."
publish = false

# Cedar is the PDP engine (ADR-0017): the speed-spike gate passed, so cedar-policy is
# now a real dependency. The core is no longer zero-dep or pure-std; it is a thin
# orchestrator around Cedar's formally-verified evaluator. `decide` stays deterministic
# (Cedar is) and the escalate lane is still returned, not run.
[dependencies]
cedar-policy = "4.11"

# Dev-only: the conformance-corpus harness (tests/, benches/) loads the external JSON
# spec and maps it to the domain types at the edge. anyhow (not thiserror) because the
# harness only reports errors, never branches on them. Vetted 2026-06-06. criterion
# drives the stage-1 latency bench (benches/cedar_decide.rs).
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
criterion = "0.5"

[[bench]]
name = "cedar_decide"
harness = false
