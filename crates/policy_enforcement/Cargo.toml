[package]
name = "policy_enforcement"
version = "0.0.0"
edition = "2024"
description = "Agent-action governance PEP: a command-hook binary that normalizes a provider tool call, decides it via the policy_decision PDP, and returns allow/deny/ask (OWASP Agentic, ASI05 v0)."
publish = false

# The enforcement point is one binary, `enforce`, invoked as a provider PreToolUse command
# hook (ADR-0021). It is the impure edge (stdin JSON + exit codes) over the pure core,
# exactly parallel to how policy_decision_py is the FFI edge.
[[bin]]
name = "enforce"
path = "src/main.rs"

[dependencies]
policy_decision = { path = "../policy_decision" }
# serde at the edge only (the core stays serde-free): parse the provider payload in,
# serialize the `ask` response out. globset is the vetted glob matcher for the resource map
# (BurntSushi, ripgrep's matcher) — meets the dependency bar; do not hand-roll globbing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
# regex is the vetted matcher for the command signatures (the shell-command classifier,
# ADR-0023) — meets the dependency bar; do not hand-roll command pattern matching.
regex = "1"

# The conformance test (tests/pep_conformance.rs) runs the built binary black-box and parses
# the case fixture; it links dev-deps, not the crate's own deps.
[dev-dependencies]
serde_json = "1"
