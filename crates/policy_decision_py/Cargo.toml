[package]
name = "policy_decision_py"
version = "0.0.0"
edition = "2024"
description = "PyO3 binding for the policy_decision PDP: a thin cdylib exposing decide over a JSON wire to the Python host."
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
policy_decision = { path = "../policy_decision" }
# Cedar parses the policy source + entity JSON the wire carries (ADR-0017); the binding
# constructs the Policy from them at the edge before calling the core.
cedar-policy = "4.11"
pyo3 = "0.28.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# `extension-module` is OFF by default so `cargo test`/`clippy` can build without
# linking libpython; maturin turns it on for the wheel (see pyproject [tool.maturin]).
[features]
extension-module = ["pyo3/extension-module"]
